services:
  # 1. Vector Database — Qdrant
  vector-db:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # 2. Cache / Task Queue Store — Valkey (Redis-compatible)
  valkey:
    image: valkey/valkey:latest
    container_name: valkey_db
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # 3. Redis Web Management GUI (RedisInsight)
  # redis-ui:
  #   image: redis/redisinsight:latest
  #   container_name: redis_insight
  #   ports:
  #     - "5540:5540"
  #   depends_on:
  #     valkey:
  #       condition: service_healthy
  #   restart: unless-stopped

  # 4. Python RAG Application
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/app/uploads
    depends_on:
      valkey:
        condition: service_healthy
      vector-db:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://valkey:6379
      - QDRANT_URL=http://vector-db:6333
    env_file:
      - .env
    restart: unless-stopped

volumes:
  valkey_data:
  qdrant_data:
